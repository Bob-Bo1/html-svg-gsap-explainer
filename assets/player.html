<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:0 22px;background:var(--bg);color:var(--ink);font-family:var(--font),sans-serif}header{max-width:1440px;margin:auto;height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #65747540;gap:20px}header strong{font-size:16px}button{font:inherit;padding:9px 14px;border:1px solid #65747545;border-radius:10px;background:transparent;color:inherit;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}main{max-width:1440px;margin:auto;display:flex;align-items:center;flex-direction:column}.view{width:min(100%,calc((100vh - 230px)*var(--ratio)));aspect-ratio:var(--ratio);margin-top:15px;border:1px solid #65747535;border-radius:18px;overflow:hidden;cursor:pointer}svg{width:100%;height:100%;display:block;fill:var(--ink);font-family:var(--font),sans-serif}.caption{max-width:1200px;width:100%;display:flex;gap:18px;align-items:center;padding:12px;min-height:66px}.caption p{margin:0;line-height:1.7;font-size:15px;flex:1}.counter{font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}.controls{width:min(100%,1200px);display:flex;align-items:center;gap:12px;justify-content:space-between}.chapters{display:flex;gap:4px;flex-wrap:wrap}.chapters button{font-size:12px;border-color:transparent;padding:7px 10px}.chapters .active{color:var(--accent);border-color:var(--accent)}.nav{display:flex;align-items:center;gap:9px;white-space:nowrap}.next{background:var(--accent);color:var(--bg);font-weight:700}.hint{font-size:12px;opacity:.7;margin:12px 0 18px}.status{font-size:12px;min-width:64px}.tools{display:flex;gap:8px}.tools button{font-size:12px}dialog{background:var(--bg);color:var(--ink);border:1px solid #65747560;border-radius:16px;width:min(800px,92vw);max-height:85vh;padding:24px}dialog::backdrop{background:#253D3F66}dialog p{line-height:1.8}dialog h3{font-size:16px}dialog a{color:var(--accent)}@media(max-width:850px){body{padding:0 10px}.view{width:100%}.controls{flex-wrap:wrap;justify-content:center}.chapters{justify-content:center;width:100%}.caption p{font-size:13px}.hint{text-align:center;line-height:1.8}}
</style></head><body>
<header><strong id="brand"></strong><div class="tools"><button id="notes">讲解稿</button><button id="full">全屏</button><button id="reset">重置</button></div></header>
<main><div class="view" id="view" tabindex="0" role="button" aria-label="点击推进一个阶段"><svg id="canvas" role="img" aria-labelledby="heading"><defs id="defs"></defs><rect id="paper"/><text id="chapter" x="65" y="58" font-size="18"/><text id="heading" x="65" y="112" font-size="36" font-weight="700"/><path id="rule" fill="none" stroke="#65747535"/><g id="objects"></g><text id="note" x="65" font-size="19"/><text id="cue" x="65" font-size="18"/></svg></div>
<div class="caption" aria-live="polite"><span class="counter" id="counter"></span><p id="narration"></p></div><div class="controls"><nav class="chapters" id="chapters" aria-label="章节"></nav><div class="nav"><button id="prev">← 上一步</button><span class="status" id="status">等待点击</span><button class="next" id="next">下一步 →</button></div></div><p class="hint">点击画面 / 空格 / → 下一步　·　← 上一步　·　R 重置　·　F 全屏</p></main>
<dialog id="dialog"><button id="close">关闭 ×</button><div id="notesContent"></div></dialog>
<script id="explainer-data" type="application/json">__SCENE_JSON__</script>
<script>/*__GSAP__*/</script>
<script>
(()=>{'use strict';const D=JSON.parse(document.getElementById('explainer-data').textContent),NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),els={},poses={};
const defaults={x:0,y:0,scale:1,scaleX:1,scaleY:1,rotation:0,opacity:1};let index=0,busy=false,timeline=null;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function element(tag,a={},text){const e=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
document.documentElement.style.setProperty('--bg',D.palette.background);document.documentElement.style.setProperty('--ink',D.palette.ink);document.documentElement.style.setProperty('--accent',D.palette.accent);document.documentElement.style.setProperty('--font',D.font||'Microsoft YaHei');document.documentElement.style.setProperty('--ratio',D.width/D.height);
$('#brand').textContent=D.title;$('#canvas').setAttribute('viewBox',`0 0 ${D.width} ${D.height}`);$('#paper').setAttribute('width',D.width);$('#paper').setAttribute('height',D.height);$('#paper').setAttribute('fill',D.palette.background);$('#rule').setAttribute('d',`M65 140 H${D.width-65} M65 ${D.height-130} H${D.width-65}`);$('#note').setAttribute('y',D.height-88);$('#cue').setAttribute('y',D.height-35);$('#cue').setAttribute('fill',D.palette.accent);
const arrows=new Set();function arrow(color){const key='arrow-'+color.slice(1);if(!arrows.has(key)){const m=element('marker',{id:key,markerWidth:12,markerHeight:12,refX:10,refY:6,orient:'auto',markerUnits:'userSpaceOnUse'});m.append(element('path',{d:'M0 1 L10 6 L0 11',fill:'none',stroke:color,'stroke-width':2}));$('#defs').append(m);arrows.add(key)}return `url(#${key})`}
function child(c){const paint={fill:c.fill||'none',stroke:c.stroke||'none','stroke-width':c.strokeWidth||1,opacity:c.opacity??1};let e;
if(c.kind==='rect')e=element('rect',{x:c.x||0,y:c.y||0,width:c.w,height:c.h,rx:c.rx||0,...paint});
else if(c.kind==='circle')e=element('circle',{cx:c.cx,cy:c.cy,r:c.r,...paint});
else if(c.kind==='ellipse')e=element('ellipse',{cx:c.cx,cy:c.cy,rx:c.rx,ry:c.ry,...paint});
else if(c.kind==='line')e=element('line',{x1:c.x1,y1:c.y1,x2:c.x2,y2:c.y2,...paint});
else if(c.kind==='path')e=element('path',{d:c.d,...paint});
else if(c.kind==='polygon'||c.kind==='polyline')e=element(c.kind,{points:c.points.map(x=>x.join(',')).join(' '),...paint});
else if(c.kind==='text'){const lines=c.text.split('\n'),size=c.fontSize||28,lineHeight=size*1.3,x=(c.x||0)+(c.align==='left'?0:c.align==='right'?c.w:c.w/2),y=(c.y||0)+c.h/2-(lines.length-1)*lineHeight/2;
e=element('text',{x,y,'text-anchor':c.align==='left'?'start':c.align==='right'?'end':'middle','dominant-baseline':'central','font-size':size,'font-weight':c.fontWeight||400,fill:c.fill||D.palette.ink,opacity:c.opacity??1});lines.forEach((line,i)=>e.append(element('tspan',{x,y:y+i*lineHeight},line)))}else throw new Error('Unsupported visual element '+c.kind);
if(c.arrowEnd)e.setAttribute('marker-end',arrow(c.stroke||D.palette.accent));return e}
for(const o of D.objects){const g=element('g',{'data-object':o.id,id:'object-'+o.id});o.children.forEach(c=>g.append(child(c)));$('#objects').append(g);els[o.id]=g;poses[o.id]={...defaults,opacity:0}}
function pose(state,id){return {...defaults,...state.objects[id],opacity:state.objects[id]?(state.objects[id].opacity??1):0}}
function matrix(p){let a=p.rotation*Math.PI/180,c=Math.cos(a),s=Math.sin(a),sx=p.scale*p.scaleX,sy=p.scale*p.scaleY;return [c*sx,s*sx,-s*sy,c*sy,p.x,p.y].map(v=>Math.abs(v)<1e-10?0:Number(v.toFixed(7)))}
function draw(){for(const id in poses){els[id].setAttribute('transform',`matrix(${matrix(poses[id]).join(' ')})`);els[id].setAttribute('opacity',poses[id].opacity)}}
function exact(){const s=D.states[index];for(const id in poses)Object.assign(poses[id],pose(s,id));draw()}
const chapters=[];D.states.forEach((s,i)=>{const name=s.chapter||'演示';if(!chapters.some(c=>c.name===name))chapters.push({name,start:i})});
function labels(){const s=D.states[index];$('#heading').textContent=s.title;$('#chapter').textContent=s.chapter||'点击式科普';$('#note').textContent=s.note||'';$('#narration').textContent=s.narration||'';$('#counter').textContent=String(index+1).padStart(2,'0')+' / '+D.states.length;$('#cue').textContent=index===D.states.length-1?'演示完成，可回看或重置。':'下一步：'+D.states[index+1].title+' →';$('#prev').disabled=busy||index===0;$('#next').disabled=busy||index===D.states.length-1;$('#next').textContent=index===D.states.length-1?'演示完成':'下一步 →';$('#status').textContent=busy?'变化中…':'等待点击';Array.from($('#chapters').children).forEach((b,i)=>{const active=chapters[i].name===(s.chapter||'演示');b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})}
function goTo(n,animate=true){if(timeline)timeline.kill();index=Math.max(0,Math.min(D.states.length-1,n));busy=animate&&!reduce;labels();if(!busy){exact();return}const state=D.states[index];timeline=gsap.timeline({paused:true,defaults:{duration:state.duration||.8,ease:'power2.inOut'},onUpdate:draw,onComplete(){exact();busy=false;labels()}});
for(const id in poses){const p=poses[id],v=pose(state,id);if(p.opacity<.01&&v.opacity>.01)timeline.set(p,{...v,opacity:0,y:v.y+14,scale:v.scale*.97},0);timeline.to(p,v.opacity>.01?v:{opacity:0},.05)}timeline.play()}
function next(){if(!busy&&index<D.states.length-1)goTo(index+1)}function previous(){if(!busy&&index>0)goTo(index-1)}function reset(){goTo(0,false)}
$('#view').addEventListener('click',next);$('#next').addEventListener('click',next);$('#prev').addEventListener('click',previous);$('#reset').addEventListener('click',reset);chapters.forEach(c=>{const b=document.createElement('button');b.textContent=c.name;b.addEventListener('click',()=>{if(!busy)goTo(c.start)});$('#chapters').append(b)});
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('#status').textContent='可用 F11 全屏'}}$('#full').addEventListener('click',full);
for(const s of D.states){const h=document.createElement('h3'),p=document.createElement('p');h.textContent=s.title;p.textContent=s.narration||'';$('#notesContent').append(h,p)}for(const source of D.sources||[]){const p=document.createElement('p'),a=document.createElement('a');a.textContent=source.title;a.href=/^https?:\/\//.test(source.url)?source.url:'#';a.target='_blank';a.rel='noopener';p.append(a);$('#notesContent').append(p)}
$('#notes').addEventListener('click',()=>$('#dialog').showModal());$('#close').addEventListener('click',()=>$('#dialog').close());document.addEventListener('keydown',e=>{if($('#dialog').open||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(['Space','Enter'].includes(e.code)&&e.target.tagName==='BUTTON')return;if(['Space','Enter','ArrowRight','PageDown'].includes(e.code)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.code)){e.preventDefault();previous()}else if(e.key.toLowerCase()==='r')reset();else if(e.key.toLowerCase()==='f')full()});
window.explainer={getState:()=>({index,busy,count:D.states.length}),goTo,next,previous,reset,matrix,exportScene:()=>JSON.parse(JSON.stringify(D))};goTo(0,false);
})();
</script></body></html>
